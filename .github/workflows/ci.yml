name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads the repository; artifacts are uploaded by the fuzz job
# on failure and need no other scope.
permissions:
  contents: read

# A superseded push does not need to finish: the newest commit is the one whose
# result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Correctness gate: every push builds Debug with ASan + UBSan and runs the
  # whole suite. A parser that reads past the end of a mapping must fail here,
  # not in a benchmark.
  sanitizers:
    name: ${{ matrix.compiler }} - Debug + ASan/UBSan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang++
            c_compiler: clang
          - compiler: g++
            c_compiler: gcc
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DITCHSTREAM_SANITIZE=ON
          -DITCHSTREAM_WERROR=ON
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}

      - name: Build
        run: cmake --build build -j

      - name: Test under sanitizers
        run: ctest --test-dir build --output-on-failure

  # Release gate: benchmarks stay local, but the Release binary still has to
  # build, pass the suite, and produce identical output twice on the same file.
  release:
    name: g++ - Release + determinism
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DITCHSTREAM_WERROR=ON
          -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Generate a synthetic file
        run: ./tools/gen_synthetic.py -o synthetic.itch --messages 200000

      - name: Stats smoke test
        run: ./build/itchstream stats synthetic.itch --repeat 3 --no-machine

      - name: Dump one symbol and re-parse the dump
        run: |
          ./build/itchstream dump synthetic.itch --symbol SPY --out spy.itch --no-machine
          ./build/itchstream dump synthetic.itch --symbol SPY --out spy.txt --format text --no-machine --quiet
          grep -q 'symbol=SPY' spy.txt
          ./build/itchstream stats spy.itch --json --no-machine --repeat 1 > dumped.json
          python3 - <<'PY'
          import json
          dumped = json.load(open("dumped.json"))
          assert dumped["walk_ok"], dumped
          assert dumped["messages"] > 0, "SPY missing from the synthetic file"
          assert dumped["decode_failures"] == 0, dumped
          print("dump ok:", dumped["messages"], "messages for SPY")
          PY

      - name: Replay - byte-exact, symbol agreement with dump, limit
        run: |
          # Whole file, out and back: the bytes must survive the trip.
          ./build/itchstream replay synthetic.itch --speed 100000 --out replayed.itch --no-machine --quiet
          cmp synthetic.itch replayed.itch

          # replay --symbol and dump --symbol are two names for one stream.
          ./build/itchstream replay synthetic.itch --symbol SPY --speed 100000 --out replay_spy.itch --no-machine --quiet
          cmp spy.itch replay_spy.itch

          # --limit emits exactly that many messages.
          ./build/itchstream replay synthetic.itch --limit 100 --speed 1000 --out replayed_100.itch --json --no-machine > replay.json
          python3 - <<'PY'
          import json
          replay = json.load(open("replay.json"))
          assert replay["walk_ok"], replay
          assert replay["emitted"] == 100, replay["emitted"]
          assert replay["scanned"] == 100, replay["scanned"]
          assert replay["bytes"] > 0, replay
          print("replay ok:", replay["emitted"], "messages,", replay["bytes"], "bytes")
          PY

          # --out pointing at the input is refused: the input is mapped while
          # the output is written. The file must survive the attempt.
          set +e
          ./build/itchstream replay synthetic.itch --out synthetic.itch
          test $? -eq 3
          set -e
          ./build/itchstream stats synthetic.itch --quiet --no-machine

      - name: FR-11 determinism - same file in, identical counts out
        run: |
          ./build/itchstream stats synthetic.itch --repeat 1 --json > first.json
          ./build/itchstream stats synthetic.itch --repeat 1 --json > second.json
          python3 - <<'PY'
          import json
          first = json.load(open("first.json"))
          second = json.load(open("second.json"))
          # Wall time differs by design; everything derived from the bytes must not.
          for key in ("bytes", "messages", "decoded", "skipped", "by_type",
                      "first_timestamp_ns", "last_timestamp_ns", "walk_ok"):
              assert first[key] == second[key], f"{key} differed: {first[key]} != {second[key]}"
          print("determinism ok:", first["messages"], "messages")
          PY

  # Fuzz gate: libFuzzer under ASan for a fixed time, plus the always-built
  # deterministic driver, which logs the seed and the iteration it is on.
  fuzz:
    name: clang - libFuzzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DITCHSTREAM_FUZZER=ON
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER=clang

      - name: Build
        run: cmake --build build -j

      - name: Seed the corpus with valid messages
        run: ./tools/gen_synthetic.py -o seed.itch --messages 200 --quiet

      - name: Fuzz for 90 seconds
        run: >
          ./build/itchstream_fuzz seed.itch
          -max_total_time=90
          -print_final_stats=1
          -rss_limit_mb=4096
          -artifact_prefix=./

      - name: Upload any crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore

  windows:
    name: windows - MSVC Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
